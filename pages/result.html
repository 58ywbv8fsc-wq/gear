<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GearDNA Result</title>
<link rel="stylesheet" href="../css/style.css?v=20261027-mouse-result-details">
</head>
<body>

<section class="result">

    <div class="result-card">

        <h1>Your GearDNA</h1>

        <h2 id="scoreText"></h2>
        <p id="usedMouseSummary"></p>
        <div id="mouseProfileSummary" class="mouse-profile-summary"></div>

        <div class="type-card">

            <h3>Player Type</h3>

            <p id="playerType"></p>
            <div class="stats">

    <div class="stat">
        <span>Competitive</span>
        <div class="bar">
            <div id="competitiveBar" class="fill"></div>
        </div>
    </div>

    <div class="stat">
        <span>Control</span>
        <div class="bar">
            <div id="controlBar" class="fill"></div>
        </div>
    </div>

    <div class="stat">
        <span>Speed</span>
        <div class="bar">
            <div id="speedBar" class="fill"></div>
        </div>
    </div>

</div>

<div class="recommendation-list" id="recommendations">
</div>
</div>

        </div>

    </div>

</section>

<script src="../js/result.js?v=20261027-mouse-result-details"></script>

</body>
</html>
