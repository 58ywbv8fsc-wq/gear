<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GearDNA Diagnosis</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<section class="diagnosis-form">

    <div class="diagnosis-container">

        <h1>GearDNA Analysis</h1>

        <p>
            あなたのデバイス遍歴を教えてください
        </p>

        <form id="gearForm">

            <div class="input-group">

                <label>現在のマウス</label>

                <input type="text" id="currentMouse" list="mouseList" placeholder="マウス名を検索..." class="search-input">
                
                <datalist id="mouseList"></datalist>

            </div>

            <div class="input-group">

                <label>過去に使ったマウス</label>
                <small>チェックしたマウスは診断に反映し、おすすめ候補から除外します。</small>

                <div class="checkbox-grid" id="usedMouseList"></div>

            </div>

            <div class="input-group">

                <label>現在のキーボード</label>

                <select id="currentKeyboard"></select>

            </div>
            <div class="input-group">

              <label>持ち方</label>

                <select id="grip">

                 <option>Claw</option>

                 <option>Palm</option>

                 <option>Fingertip</option>

                </select>

            </div>
            <div class="input-group">

             <label>手の長さ(cm)</label>

               <input
                 type="number"
                 id="handLength"
                 placeholder="例: 18.5"
                 step="0.1"
               >

            </div>
            <div class="input-group">

              <label>手の幅(cm)</label>

               <input
                 type="number"
                 id="handWidth"
                 placeholder="例: 9.5"
                 step="0.1"
              >

          </div>

            <div class="input-group">

                <label>現在のマウスパッド</label>

                <select id="currentMousepad"></select>

            </div>

            <div class="input-group">

                <label>主にプレイするゲーム</label>

                <select>
                    <option>VALORANT</option>
                    <option>CS2</option>
                    <option>Apex Legends</option>
                </select>

            </div>

            <button class="analyze-btn">
                Analyze GearDNA
            </button>

        </form>

    </div>

</section>
<script src="../js/diagnose.js"></script>

</body>
</html>
