<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GearDNA Diagnosis</title>
    <link rel="stylesheet" href="../css/style.css?v=20261027-responsive">
</head>
<body>

<section class="diagnosis-form">

    <div class="diagnosis-container">

        <h1>GearDNA Analysis</h1>

        <p>
            あなたのデバイス遍歴を教えてください
        </p>

        <form id="gearForm">

            <div class="input-group">

                <label>現在のマウス</label>

                <input type="text" id="currentMouse" list="mouseList" placeholder="マウス名を検索..." class="search-input">
                
                <datalist id="mouseList"></datalist>

            </div>

            <div class="input-group">

                <label>過去に使ったマウス</label>
                <small>チェックしたマウスは診断に反映し、おすすめ候補から除外します。</small>

                <div class="checkbox-grid" id="usedMouseList"></div>

            </div>

            <div class="input-group">

                <label>現在のキーボード</label>

                <select id="currentKeyboard">
                    <option>PCMK 2 HE TKL</option>
                    <option>Wooting 80HE</option>
                    <option>Apex Pro TKL</option>
                    <option>GravaStar Mercury K1 Pro</option>
                    <option>GravaStar Mercury K1</option>
                    <option>GravaStar Mercury K1 Lite</option>
                    <option>GravaStar Mercury K98 Pro</option>
                    <option>AIM1 瞬 MATATAKI</option>
                    <option>Razer Huntsman V3 Pro Tenkeyless 8KHz</option>
                    <option>Logitech PRO X TKL RAPID</option>
                    <option>Keychron Q1 HE</option>
                    <option>SteelSeries Apex Pro TKL Gen 3</option>
                    <option>Wooting 60HE+</option>
                    <option>DrunkDeer A75 Pro</option>
                    <option>ASUS ROG Falchion Ace HFX</option>
                </select>

            </div>
            <div class="input-group">

              <label>持ち方</label>

                <select id="grip">

                 <option>Claw</option>

                 <option>Palm</option>

                 <option>Fingertip</option>

                </select>

            </div>
            <div class="input-group">

             <label>手の長さ(cm)</label>

               <input
                 type="number"
                 id="handLength"
                 placeholder="例: 18.5"
                 step="0.1"
               >

            </div>
            <div class="input-group">

              <label>手の幅(cm)</label>

               <input
                 type="number"
                 id="handWidth"
                 placeholder="例: 9.5"
                 step="0.1"
              >

          </div>

            <div class="input-group">

                <label>現在のマウスパッド</label>

                <select id="currentMousepad">
                    <option>NINJA FX Zero</option>
                    <option>SP-004</option>
                    <option>QcK</option>
                    <option>NINJA FX Hien</option>
                    <option>NINJA FX Hayate-Otsu V2</option>
                    <option>Logitech G640</option>
                    <option>Logitech G840</option>
                    <option>Razer Gigantus V2</option>
                    <option>SteelSeries QcK Heavy</option>
                    <option>Pulsar ES2 eSports Mousepad</option>
                </select>

            </div>

            <div class="input-group">

                <label>主にプレイするゲーム</label>

                <select>
                    <option>VALORANT</option>
                    <option>CS2</option>
                    <option>Apex Legends</option>
                </select>

            </div>

            <button class="analyze-btn">
                Analyze GearDNA
            </button>

        </form>

    </div>

</section>
<script src="../js/diagnose.js?v=20261027-mousepads-10"></script>

</body>
</html>
